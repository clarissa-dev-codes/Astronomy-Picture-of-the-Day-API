<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Picture of the Day</title>
    <style>
        /* Modern Reset and Full Layout Sizing Controls */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #050505; color: #ffffff; 
        }
        
        /* Blurred mirrored layer behind the main content */
        #bg-blur-layer {
            position: fixed; top: -10%; left: -10%; width: 120vw; height: 120vh;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: 1; opacity: 0.75;
            display: none;
        }

        /* Fixed full viewport media anchor */
        #bg-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; background-color: #000000; 
        }
        #bg-container iframe, #bg-container img { 
            width: 100%; height: 100%; border: none; object-fit: contain; position: absolute; top: 0; left: 0; 
        }

        /* Windows Glassmorphism Lockscreen Panel Layout */
        #lockscreen-card {
            position: absolute; bottom: 40px; left: 40px; z-index: 3; max-width: 420px; padding: 24px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            opacity: 0; transition: opacity 0.4s ease-in-out;
        }
        #title { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
        #date { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        #explanation-wrapper { max-height: 180px; overflow-y: auto; padding-right: 4px; }
        #explanation { font-size: 0.95rem; line-height: 1.5; color: rgba(255, 255, 255, 0.9); }
        #explanation-wrapper::-webkit-scrollbar { width: 4px; }
        #explanation-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="bg-blur-layer"></div>
    <div id="bg-container"></div>
    
    <main id="lockscreen-card">
        <h1 id="title">Loading Telemetry...</h1>
        <div id="date"></div>
        <div id="explanation-wrapper">
            <div id="explanation">Connecting to NASA telemetry streams...</div>
        </div>
    </main>

    <script>
        async function loadDashboard() {
            const container = document.getElementById('bg-container');
            const blurLayer = document.getElementById('bg-blur-layer');
            const card = document.getElementById('lockscreen-card');
            
            // Unbreakable high-resolution cosmic fallback asset
            const defaultSpaceBg = "https://unsplash.com";

            try {
                const res = await fetch(`https://nasa.gov{new Date().getTime()}`);
                if (!res.ok) throw new Error("API Route Failure");
                
                const posts = await res.json();
                if (!posts || posts.length === 0) throw new Error("Null data footprint");
                
                // Read from the first array item of NASA's new payload
                const data = posts;

                // Populate user profile info card elements
                const title = data.title?.rendered || data.title || "Cosmic View";
                document.getElementById('title').innerText = title;
                document.title = `NASA APOD - ${title}`;
                document.getElementById('date').innerText = (data.date || "").split("T");
                document.getElementById('explanation').innerHTML = data.explanation || data.content?.rendered || "";

                // Isolate media tracking channels
                let videoUrl = data.basic_html_url || "";
                let imageUrl = data.featured_media_src_url || "";

                // Check for fallback fields inside nested sub-dictionaries if present
                if (data.apod && typeof data.apod === 'object') {
                    videoUrl = videoUrl || data.apod.url || "";
                    imageUrl = imageUrl || data.apod.hdurl || data.apod.url || "";
                }

                // --- SMART CLASSIFICATION ROUTER ---
                // If video links exist OR if the default imageUrl is stuck on a placeholder logo path:
                if (videoUrl && (videoUrl.includes('youtube.com') || videoUrl.includes('player.') || videoUrl.includes('html') || videoUrl.includes('vimeo'))) {
                    // Force HTTPS connections securely to beat Mixed Content blockades
                    if (videoUrl.startsWith("http://")) {
                        videoUrl = videoUrl.replace("http://", "https://");
                    }
                    container.innerHTML = `<iframe src="${videoUrl}?autoplay=1&mute=1&loop=1&controls=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else if (imageUrl && !imageUrl.includes('nasa-logo')) {
                    container.innerHTML = `<img src="${imageUrl}" alt="Space Asset Image">`;
                    blurLayer.style.backgroundImage = `url('${imageUrl}')`;
                    blurLayer.style.display = "block";
                } else {
                    // Fail-safe: Render fallback cosmic photo if fields are blank or blocked
                    container.innerHTML = `<img src="${defaultSpaceBg}" alt="Cosmic Placeholder View">`;
                    blurLayer.style.backgroundImage = `url('${defaultSpaceBg}')`;
                    blurLayer.style.display = "block";
                }

                // Smooth reveal for glassmorphism layout card
                card.style.opacity = "1";

            } catch (err) {
                console.error("Dashboard render exception error:", err);
                document.getElementById('title').innerText = "Deep Space Network";
                document.getElementById('date').innerText = new Date().toISOString().split('T');
                document.getElementById('explanation').innerText = "NASA transmission is routing. Enjoy this look at the stars while systems sync.";
                container.innerHTML = `<img src="${defaultSpaceBg}" alt="Cosmic View">`;
                blurLayer.style.backgroundImage = `url('${defaultSpaceBg}')`;
                blurLayer.style.display = "block";
                card.style.opacity = "1";
            }
        }
        loadDashboard();
    </script>
</body>
</html>
