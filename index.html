<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Picture of the Day</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #050505; color: #fff; }
        
        #bg-blur-layer {
            position: fixed; top: -10%; left: -10%; width: 120vw; height: 120vh;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: 1; opacity: 0.75;
        }
        #bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }
        #bg-container iframe, #bg-container img { width: 100%; height: 100%; border: none; object-fit: contain; position: absolute; }

        #lockscreen-card {
            position: absolute; bottom: 40px; left: 40px; z-index: 3; max-width: 420px; padding: 24px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        #title { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
        #date { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 12px; text-transform: uppercase; }
        #explanation-wrapper { max-height: 180px; overflow-y: auto; }
        #explanation { font-size: 0.95rem; line-height: 1.5; color: rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body>
    <div id="bg-blur-layer"></div>
    <div id="bg-container"></div>
    
    <main id="lockscreen-card">
        <h1 id="title">Loading Telemetry...</h1>
        <div id="date"></div>
        <div id="explanation-wrapper">
            <div id="explanation">Synchronizing with NASA data stream...</div>
        </div>
    </main>

    <script>
        async function loadDashboard() {
            try {
                // Fetch your local data snapshot with a cache buster to force updates
                const res = await fetch(`data.json?v=${new Date().getTime()}`);
                const data = await res.json();

                // 1. Resolve Title text fields cleanly
                const title = data.title?.rendered || data.title || "Cosmic View";
                document.getElementById('title').innerText = title;
                document.title = `NASA APOD - ${title}`;

                // 2. Resolve Date fields
                document.getElementById('date').innerText = (data.date || "").split("T")[0];

                // 3. Resolve Explanation descriptors
                document.getElementById('explanation').innerHTML = data.explanation || data.content?.rendered || "";

                // 4. Fallback asset verification logic checks
                const mediaUrl = data.basic_html_url || "";
                const imgUrl = data.featured_media_src_url || "";
                const container = document.getElementById('bg-container');
                const blurLayer = document.getElementById('bg-blur-layer');

                // If a valid alternative HTML or iframe media url is provided, default to responsive frame
                if (mediaUrl && !mediaUrl.includes('nasa-logo')) {
                    container.innerHTML = `<iframe src="${mediaUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    blurLayer.style.display = "none";
                } else if (imgUrl && !imgUrl.includes('nasa-logo')) {
                    container.innerHTML = `<img src="${imgUrl}" alt="Space Asset">`;
                    blurLayer.style.backgroundImage = `url('${imgUrl}')`;
                } else {
                    // Universal default placeholder if NASA's upload window goes completely blank
                    const backup = "https://unsplash.com";
                    container.innerHTML = `<img src="${backup}" alt="Space Fallback">`;
                    blurLayer.style.backgroundImage = `url('${backup}')`;
                }
            } catch (err) {
                console.error("Dashboard render block exception:", err);
                document.getElementById('title').innerText = "System Offline";
            }
        }
        loadDashboard();
    </script>
</body>
</html>
