<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Picture of the Day - Cosmic View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; }

        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        #bg-container iframe {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            border: none;
        }

        #lockscreen-card {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 2;
            max-width: 420px;
            padding: 24px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #date {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #explanation-wrapper {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 8px;
        }

        #explanation {
            font-size: 0.95rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }

        #explanation-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        #explanation-wrapper::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="bg-container"></div>
    <main id="lockscreen-card">
        <div id="title">Loading...</div>
        <div id="date"></div>
        <div id="explanation-wrapper">
            <div id="explanation">Connecting to NASA telemetry...</div>
        </div>
    </main>

    <script>
        // Directly contacts the upcoming post-2026 production platform 
        // Adding a cache-busting timestamp guarantees GitHub won't serve stale data
        const cacheBuster = new Date().getTime();
        const URL = `https://nasa.gov{cacheBuster}`;

        async function fetchAPOD() {
            try {
                const response = await fetch(URL);
                if (!response.ok) throw new Error("Network latency detected.");
                
                const posts = await response.json();
                if (!posts || posts.length === 0) return;

                const post = posts[0];
                
                // Extract elements safely according to the updated NASA structure
                const title = post.title?.rendered || post.title || "Cosmic View";
                const dateRaw = post.date || "";
                const cleanDate = dateRaw.split("T")[0]; // Drops time tracking fragments
                const explanation = post.explanation || post.content?.rendered || "";
                
                // Locate media assets
                const assetUrl = post.hdurl || post.url || post.featured_media_src_url || "";
                
                // Update text elements
                document.getElementById('title').innerText = title;
                document.getElementById('date').innerText = cleanDate;
                document.getElementById('explanation').innerHTML = explanation;
                document.title = `NASA Picture of the Day - ${title}`;

                const container = document.getElementById('bg-container');
                
                // Render asset types correctly
                if (assetUrl.includes('youtube.com') || assetUrl.includes('vimeo.com') || assetUrl.includes('player.')) {
                    let embedUrl = assetUrl.replace("watch?v=", "embed/");
                    container.innerHTML = `<iframe src="${embedUrl}?autoplay=1&mute=1&loop=1&controls=0" allow="autoplay"></iframe>`;
                } else if (assetUrl) {
                    container.style.backgroundImage = `url('${assetUrl}')`;
                }

                // Smoothly reveal layout card
                document.getElementById('lockscreen-card').style.opacity = "1";

            } catch (error) {
                console.error("APOD Error:", error);
                document.getElementById('title').innerText = "System Offline";
                document.getElementById('explanation').innerText = "Unable to route request to NASA servers. Please refresh shortly.";
            }
        }

        fetchAPOD();
    </script>
</body>
</html>
