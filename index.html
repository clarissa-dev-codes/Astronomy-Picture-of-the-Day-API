<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Picture of the Day</title>
    <style>
        /* CSS Layout Layer Configurations */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #050505; color: #ffffff; 
        }
        
        /* Blurred canvas mirror backdrop elements */
        #bg-blur-layer {
            position: fixed; top: -10%; left: -10%; width: 120vw; height: 120vh;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: 1; opacity: 0.75;
            display: none;
        }

        /* Direct full screen content anchor frame */
        #bg-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; background-color: #000000; 
        }
        #bg-container iframe, #bg-container img { 
            width: 100%; height: 100%; border: none; object-fit: contain; position: absolute; top: 0; left: 0; 
        }

        /* Windows Glassmorphism lockscreen interface template */
        #lockscreen-card {
            position: absolute; bottom: 40px; left: 40px; z-index: 3; max-width: 420px; padding: 24px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            opacity: 0; transition: opacity 0.5s ease-in-out;
        }
        #title { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #date { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        #explanation-wrapper { max-height: 180px; overflow-y: auto; padding-right: 6px; }
        #explanation { font-size: 0.95rem; line-height: 1.5; color: rgba(255, 255, 255, 0.9); }
        
        #explanation-wrapper::-webkit-scrollbar { width: 4px; }
        #explanation-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="bg-blur-layer"></div>
    <div id="bg-container"></div>
    
    <main id="lockscreen-card">
        <h1 id="title">Loading Telemetry...</h1>
        <div id="date"></div>
        <div id="explanation-wrapper">
            <div id="explanation">Connecting directly to NASA planetary core telemetry streams...</div>
        </div>
    </main>

    <script>
        async function loadDashboard() {
            const container = document.getElementById('bg-container');
            const blurLayer = document.getElementById('bg-blur-layer');
            const card = document.getElementById('lockscreen-card');
            
            // Backup imagery asset if routes drop or experience transmission lags
            const defaultSpaceBg = "https://unsplash.com";

            try {
                // FIXED ROUTE: Utilizing the fallback proxy endpoint via api.nasa.gov 
                // DEMO_KEY is built-in, open public rate, and bypasses local DNS name blocks
                const res = await fetch(`https://nasa.gov{new Date().getTime()}`);
                if (!res.ok) throw new Error("NASA Core Gateway Unreachable");
                
                const data = await res.json();
                if (!data) throw new Error("Empty telemetry parcel returned");

                // 1. Render data text properties 
                const title = data.title || "Cosmic View";
                document.getElementById('title').innerText = title;
                document.title = `NASA APOD - ${title}`;
                document.getElementById('date').innerText = data.date || "";
                document.getElementById('explanation').innerText = data.explanation || "";

                // 2. Separate asset models cleanly (image vs video)
                const mediaType = data.media_type || "image";
                let mediaUrl = data.url || "";
                let hdUrl = data.hdurl || mediaUrl;

                if (mediaType === 'video') {
                    // Convert watch paths to direct embed paths instantly 
                    let embedUrl = mediaUrl.replace("watch?v=", "embed/");
                    if (embedUrl.startsWith("http://")) {
                        embedUrl = embedUrl.replace("http://", "https://");
                    }
                    container.innerHTML = `<iframe src="${embedUrl}?autoplay=1&mute=1&loop=1&controls=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else {
                    // Standard visual configuration rendering pipeline
                    const finalImg = hdUrl || mediaUrl || defaultSpaceBg;
                    container.innerHTML = `<img src="${finalImg}" alt="Space Background Picture">`;
                    blurLayer.style.backgroundImage = `url('${finalImg}')`;
                    blurLayer.style.display = "block";
                }

                // Smoothly fade in our lock screen visual card elements 
                card.style.opacity = "1";

            } catch (err) {
                console.error("Critical core routing error catch active:", err);
                
                // Unbreakable layout mapping default fallback state configuration
                document.getElementById('title').innerText = "Deep Space Network";
                document.getElementById('date').innerText = new Date().toISOString().split('T')[0];
                document.getElementById('explanation').innerText = "NASA space networks are sync-routing. Enjoy this look at the cosmos while parameters optimize.";
                container.innerHTML = `<img src="${defaultSpaceBg}" alt="Cosmic Visual Fallback">`;
                blurLayer.style.backgroundImage = `url('${defaultSpaceBg}')`;
                blurLayer.style.display = "block";
                card.style.opacity = "1";
            }
        }
        
        loadDashboard();
    </script>
</body>
</html>
