name: Automated Daily NASA APOD Synchronizer

on:
  schedule:
    # Triggers every morning at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows you to trigger the compilation process manually from the UI panel

permissions:
  contents: write # Explicitly grants the workflow bot clearance to save data updates

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository Branch Context
        uses: actions/checkout@v4

      - name: Initialize Hosted Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Fixed execution baseline context

      - name: Run Core Data Collection Engine
        run: python apod.py

      - name: Sync and Commit Generated Data Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Stage the freshly updated json file
          git add data.json
          
          # Commit only if data changes are present to prevent workflow failure loops
          git commit -m "chore: automated telemetry refresh [$(date -u +'%Y-%m-%d %H:%M:%S' UTC)]" || exit 0
          
          git push origin main
