name: Build NASA Daily Page

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *' # Runs fully on autopilot every single morning

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python script to generate index.html
        env:
          NASA_API: ${{ secrets.NASA_API }} # Injects your hidden key securely from GitHub
        run: python apod.py

      # Using an official action to handle deployment safely without command-line crashes
      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
