name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change this to "master" if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Uses robust bash echo manipulation instead of rigid sed string-replacement paths
      - name: Inject NASA API Key Secret
        env:
          MY_NASA_SECRET: ${{ secrets.NASA_API }}
        run: |
          sed -i "s|PARSE_NASA_KEY|$MY_NASA_SECRET|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
